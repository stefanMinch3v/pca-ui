<p-toolbar styleClass="toolbar">
  <ng-template #start>
    <h1 class="title">Contacts</h1>
  </ng-template>
  <ng-template #end>
    <p-button label="New Contact" icon="pi pi-plus" routerLink="new" />
  </ng-template>
</p-toolbar>

<p-table
  [value]="contacts()"
  [loading]="loading()"
  dataKey="id"
  [rowHover]="true"
  styleClass="contacts-table"
>
  <ng-template #header>
    <tr>
      <th>First name</th>
      <th>Last name</th>
      <th>Phone number</th>
      <th class="actions-col"></th>
    </tr>
  </ng-template>
  <ng-template #body let-contact>
    <tr>
      <td>{{ contact.firstName }}</td>
      <td>{{ contact.lastName }}</td>
      <td>{{ contact.phoneNumber }}</td>
      <td class="actions-col">
        <p-button
          icon="pi pi-pencil"
          [rounded]="true"
          [text]="true"
          [routerLink]="[contact.id, 'edit']"
          ariaLabel="Edit contact"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [rounded]="true"
          [text]="true"
          ariaLabel="Delete contact"
          (onClick)="confirmDelete(contact)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4" class="empty-state">
        @if (!loading()) {
          No contacts yet. Click "New Contact" to add one.
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<div class="pager">
  <p-button
    icon="pi pi-chevron-left"
    [text]="true"
    [rounded]="true"
    [disabled]="!hasPrevious() || loading()"
    ariaLabel="Previous page"
    (onClick)="loadPreviousPage()"
  />
  <span class="page-number">Page {{ pageNumber() }}</span>
  <p-button
    icon="pi pi-chevron-right"
    [text]="true"
    [rounded]="true"
    [disabled]="!hasMore() || loading()"
    ariaLabel="Next page"
    (onClick)="loadNextPage()"
  />
</div>

<p-confirmdialog />
